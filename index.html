<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>叙世者 · NARRATIVE WORLD</title>
  <link rel="stylesheet" href="css/main.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <!-- 3D 画布 -->
  <canvas id="scene"></canvas>

  <!-- 星球名称标签层(手动屏幕坐标投影) -->
  <div id="labels"></div>

  <!-- 顶部 HUD -->
  <header id="hud-top">
    <div class="hud-left">
      <div class="logo">
        <span class="logo-en">NARRATIVE WORLD</span>
        <span class="logo-cn">叙世者 · 从一次对话,到一个世界</span>
      </div>
      <div id="client-count" class="client-count">-- 位客户</div>
    </div>
    <div class="hud-center">
      <div class="search-box">
        <input id="search-input" type="text" placeholder="搜索客户 / 行业 / 关键词…" autocomplete="off" />
        <div id="search-results" class="search-results hidden"></div>
      </div>
      <select id="industry-filter" title="按行业筛选">
        <option value="">全部行业</option>
      </select>
    </div>
    <div class="hud-right">
      <button id="btn-audio" class="hud-btn" title="氛围音乐开关(默认关闭)">♪ 音乐 关</button>
      <button id="btn-params" class="hud-btn" title="参数面板开关">⚙ 参数</button>
    </div>
  </header>

  <!-- 视角预设按钮 -->
  <nav id="view-presets">
    <button class="preset-btn" data-preset="top">银河俯瞰</button>
    <button class="preset-btn" data-preset="cruise">全景巡游</button>
    <button class="preset-btn" data-preset="random">随机星球</button>
    <button class="preset-btn" data-preset="focus">聚焦选中</button>
  </nav>

  <!-- 左下角快捷键提示 -->
  <aside id="shortcuts">
    <div class="sc-title">快捷键</div>
    <div><kbd>空格</kbd> 巡航开关</div>
    <div><kbd>F</kbd> 全屏</div>
    <div><kbd>H</kbd> 隐藏 HUD</div>
    <div><kbd>ESC</kbd> 返回星系</div>
    <div><kbd>0-6</kbd> 调试视图</div>
  </aside>

  <!-- 参数面板容器(lil-gui 挂载点) -->
  <div id="params-panel" class="hidden"></div>

  <!-- 星球详情层 -->
  <section id="detail-layer" class="hidden">
    <button id="detail-back" title="返回星系(ESC)">← 返回星系</button>
    <div id="detail-panel">
      <div class="detail-head">
        <div>
          <h1 id="detail-name"></h1>
          <div id="detail-meta" class="detail-meta"></div>
        </div>
      </div>
      <div class="detail-tabs">
        <button class="tab-btn active" data-tab="story">故事资料</button>
        <button class="tab-btn" data-tab="article">最终成篇</button>
        <button class="tab-btn" data-tab="proposal">服务方案</button>
      </div>
      <div class="detail-body">
        <div id="tab-story" class="tab-pane"></div>
        <div id="tab-article" class="tab-pane hidden"></div>
        <div id="tab-proposal" class="tab-pane hidden"></div>
      </div>
      <div class="detail-foot">
        <button id="detail-enter" title="进入这颗星球的内部">进入星球 →</button>
      </div>
    </div>
  </section>

  <!-- 选中态名字牌(第一段:聚焦后停靠) -->
  <div id="name-plate" class="hidden">
    <button id="np-close" title="取消选中(Esc)">×</button>
    <div class="np-name" id="np-name"></div>
    <div class="np-meta" id="np-meta"></div>
    <div class="np-actions">
      <button id="np-enter" class="np-btn-primary">进入星球 →</button>
      <button id="np-archive" class="np-btn-ghost">查看档案</button>
    </div>
  </div>

  <!-- 底部年份导航(轨道节点) -->
  <nav id="year-nav"></nav>

  <!-- 交叉淡切遮罩 -->
  <div id="veil"></div>

  <!-- 内部层返回按钮 -->
  <button id="interior-back" class="hidden" title="返回宇宙(Esc)">← 返回宇宙</button>

  <!-- 节点占位内容卡 -->
  <div id="node-card" class="hidden">
    <button id="node-card-close" title="关闭(Esc)">×</button>
    <h3 id="node-card-title"></h3>
    <p id="node-card-body"></p>
  </div>

  <!-- 调试信息覆盖层(快捷键 7-9) -->
  <pre id="debug-info" class="hidden"></pre>

  <!-- WebGL 上下文丢失提示 -->
  <div id="gl-overlay" class="hidden">
    <div class="gl-box">
      <h2>图形上下文已丢失</h2>
      <p>正在尝试自动恢复 WebGL 渲染,请稍候…</p>
    </div>
  </div>

  <!-- 加载层 -->
  <div id="loading">
    <div class="loading-inner">
      <div class="loading-logo"><span class="logo-en">NARRATIVE WORLD</span><span class="logo-cn">叙世者 · 从一次对话,到一个世界</span></div>
      <div class="loading-bar"><div id="loading-progress"></div></div>
      <div id="loading-text">正在点亮星系…</div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
